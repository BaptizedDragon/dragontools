# Central station configuration. Keep this outside application repositories.
# Replace the OpenSSH alias; optional credential references belong here only.
version = 1

[connection]
ssh_host = "replace-me-monitoring"

# TLS identity; independent of the SSH alias. Required for a fresh station.
[ingress]
hostname = "monitoring.example.com"

