# Illustrative application contract. Replace aliases, unit and metrics endpoint
# after checking your deployment. HTTP family names were observed read-only on
# 2026-09-21; no deployment mutation is implied.
# Application repositories must never contain station or telemetry credentials.
version = 1

[application]
name = "doers"
environment = "production"

[target]
ssh_host = "softwarelanding"

[station]
ssh_host = "monitoring"
# DNS/firewall are operator-managed: TCP 9443 metrics, 9444 logs; 9445 stays closed.
# Provision this TLS identity with station monitoring install first.
# Application apply verifies existing Caddy, then enrolls the client.
hostname = "monitoring.baptizeddragon.com"

[[service]]
name = "doers"
systemd = "doers.service"

[service.logs]
enabled = true

[service.metrics]
url = "http://127.0.0.1:16005/metrics"

# Explicit family/label contract, not arbitrary queries. route is a bounded
# route template (e.g. /company/:id), never an unbounded URL label.
[service.metrics.http]
requests_total = "doers_http_requests_total"
duration_histogram = "doers_http_request_duration_seconds"
status_label = "status_class"
route_label = "route"

[service.traces]
enabled = false # true fails clearly until trace agents are implemented

[[probe]]
name = "web"
url = "https://doers.business/healthz"

[[alert]]
name = "HighErrorRate"
source = "logs"
service = "doers"
level = "error"
window = "5m"
threshold = 10
severity = "warning"

# Every probe gets ServiceProbeFailed (critical for 2m) automatically.
# One source="probe" alert referencing probe="web" can override that default;
# it replaces the default for that probe rather than creating duplicate alerts.
