name: Zig
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig fmt --check build.zig src
      - run: zig build
      - run: zig build test --summary all
      - run: python3 tests/cli_smoke.py
      - run: python3 -I -B tests/release_test.py
  cross-build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [aarch64-macos, x86_64-macos, aarch64-linux, x86_64-linux]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
      - run: python3 tools/package_release.py package --version 0.0.0-ci --target ${{ matrix.target }} --binary zig-out/bin/dragontool --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
