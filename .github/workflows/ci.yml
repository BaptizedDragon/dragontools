name: Zig
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - run: python3 tools/verify_crypto_vendor.py
      - run: zig fmt --check build.zig src
      - run: zig build
      - run: python3 tests/version_test.py
      - run: zig build test --summary all
      - run: python3 tests/cli_smoke.py
      - name: Pinned Caddy mTLS integration fixture (local sockets only)
        run: |
          python3 -I -B tools/fetch_caddy_fixture.py --output "$RUNNER_TEMP/dragontools-caddy-2.11.4"
          python3 -I -B tests/agent_ingestion_test.py --caddy "$RUNNER_TEMP/dragontools-caddy-2.11.4"
      - run: python3 -I -B tests/release_test.py
      - name: Doers signals, alerts and outage recovery (isolated Linux processes)
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: |
          fixture="$RUNNER_TEMP/dragontools-doers"
          python3 -I -B tests/integration/render_doers.py "$fixture"
          python3 -I -B tools/fetch_doers_fixture.py --output "$fixture"
          sudo unshare --net sh -c 'ip link set lo up; exec python3 -I -B tests/integration/structured_logs.py "$1"' fixture "$fixture"
          cp zig-out/bin/dragontool-agent "$fixture/dragontool-agent"
          python3 -I -B tests/integration/agent_ingestion_pipeline.py --prepare-credentials "$fixture"
          sudo unshare --net sh -c 'ip link set lo up; exec python3 -I -B tests/integration/doers_runtime.py "$1" --outage' fixture "$fixture"
      - name: Host maintenance events and native notification policy (isolated Linux processes)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          fixture="$RUNNER_TEMP/dragontools-doers"
          sudo unshare --net sh -c 'ip link set lo up; exec python3 -I -B tests/integration/host_events.py "$1" "$1" "$1" "$2"' fixture "$fixture" "$PWD/zig-out/bin/dragontool-pki-fixture"
          python3 -I -B tests/telegram_template_test.py --amtool "$fixture/amtool"
      - name: Native service metrics and dashboard LogsQL (isolated Linux processes)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          fixture="$RUNNER_TEMP/dragontools-doers"
          sudo unshare --net sh -c 'ip link set lo up; exec python3 -I -B tests/integration/service_resources.py "$1" "$2" "$1"' fixture "$fixture" "$PWD/zig-out/bin/dragontool-pki-fixture"
      - name: Linux helper filesystem lifecycle (temporary paths only)
        if: runner.os == 'Linux'
        run: sudo python3 -I -B tests/helper_install_test.py --fixture "$PWD/zig-out/bin/dragontool-pki-fixture" --agent "$PWD/zig-out/bin/dragontool-agent"
      - name: Native station bootstrap (isolated filesystem, exact production ownership)
        if: runner.os == 'Linux'
        run: sudo python3 -I -B tests/station_bootstrap_test.py --agent "$PWD/zig-out/bin/dragontool-agent"
  cross-build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [aarch64-macos, x86_64-macos, aarch64-linux, x86_64-linux]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe -Dversion=0.0.0-ci
      - run: python3 tools/package_release.py package --version 0.0.0-ci --target ${{ matrix.target }} --binary zig-out/bin/dragontool --output dist
      - if: contains(matrix.target, 'linux')
        run: python3 tools/package_release.py package --version 0.0.0-ci --target ${{ matrix.target }} --binary zig-out/bin/dragontool-agent --agent --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
